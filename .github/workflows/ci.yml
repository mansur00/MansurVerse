name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm audit --audit-level=high
# Later phases add: Playwright e2e and a11y (Phase 4), Lighthouse and size checks (Phase 7), preview deploys (Phase 8).
# Check for newer major versions of the actions above when setting up.
